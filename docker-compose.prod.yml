version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATAJURI_BASE_URL=${DATAJURI_BASE_URL}
      - DATAJURI_CLIENT_ID=${DATAJURI_CLIENT_ID}
      - DATAJURI_SECRET_ID=${DATAJURI_SECRET_ID}
      - DATAJURI_USERNAME=${DATAJURI_USERNAME}
      - DATAJURI_PASSWORD=${DATAJURI_PASSWORD}
      - ZION_DB_HOST=${ZION_DB_HOST}
      - ZION_DB_USER=${ZION_DB_USER}
      - ZION_DB_PASSWORD=${ZION_DB_PASSWORD}
      - ZION_DB_DATABASE=${ZION_DB_DATABASE}
      - SHAREPOINT_CLIENT_ID=${SHAREPOINT_CLIENT_ID}
      - SHAREPOINT_CLIENT_SECRET=${SHAREPOINT_CLIENT_SECRET}
      - SHAREPOINT_SITE_ROOT=${SHAREPOINT_SITE_ROOT}
      - DOSSIE_ENABLED=${DOSSIE_ENABLED}
      - DOSSIE_DB_URL=${DOSSIE_DB_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
  coolify:
    external: true
